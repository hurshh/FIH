name: americas_explorer
description: An offline bilingual discovery atlas for curious kids.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/fonts/Nunito-OFL.txt
    - assets/fonts/Fraunces-OFL.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
